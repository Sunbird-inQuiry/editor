<div class="lang-selector d-flex flex-ai-center mb-10"
     [style.flex-direction]="activeLang.isRTL ? 'row-reverse' : 'row'"
     [style.justify-content]="activeLang.isRTL ? 'flex-end' : 'flex-start'">
  <span class="fs-0-785 sb-color-gray-200 mr-10">{{ configService.labelConfig?.lbl?.langSelectorLabel }}:</span>
  <button
    *ngFor="let lang of languages"
    class="lang-btn sb-btn sb-btn-xs mr-5"
    [class.lang-btn--active]="activeLang.current === lang.code"
    (click)="activeLang.set(lang.code)">
    {{ lang.label }}
  </button>
</div>
